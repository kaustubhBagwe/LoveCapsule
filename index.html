<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awesome Product</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .product-image {
      text-align: center;
    }

    .product-image img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    h1 {
      margin-top: 20px;
      font-size: 2rem;
      text-align: center;
    }

    .description {
      text-align: center;
      margin: 20px 0;
    }

    .features {
      margin: 30px 0;
    }

    .features ul {
      list-style: disc;
      padding-left: 20px;
    }

    .price-box {
      text-align: center;
      margin: 30px 0;
    }

    .price {
      font-size: 2rem;
      color: #27ae60;
      font-weight: bold;
    }

    .buy-button {
      display: inline-block;
      margin-top: 15px;
      background: #27ae60;
      color: white;
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .buy-button:hover {
      background: #219150;
    }

    .contact {
      margin-top: 40px;
      text-align: center;
    }

    .contact a {
      color: #2980b9;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="product-image">
      <img src="https://via.placeholder.com/600x400?text=Product+Image" alt="Product">
    </div>
    <h1>Super Comfy Headphones</h1>
    <p class="description">Experience premium sound quality with unbeatable comfort and sleek design.</p>

    <div class="features">
      <h2>Features</h2>
      <ul>
        <li>Noise cancellation technology</li>
        <li>Wireless with 30-hour battery life</li>
        <li>Bluetooth 5.2 connectivity</li>
        <li>Built-in microphone for calls</li>
      </ul>
    </div>

    <div class="price-box">
      <p class="price">$129.99</p>
      <a href="#" class="buy-button">Add to Cart</a>
    </div>

    <div class="contact">
      <p>Need help? <a href="mailto:support@example.com">Contact support</a></p>
    </div>
  </div>
</body>
</html>
