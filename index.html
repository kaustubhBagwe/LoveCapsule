<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Product Grid with Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      overflow-x: hidden;
    }
    .cart-panel {
      position: fixed;
      top: 0;
      right: -350px;
      width: 350px;
      height: 100%;
      background: #f8f9fa;
      border-left: 1px solid #ddd;
      box-shadow: -2px 0 5px rgba(0,0,0,0.1);
      padding: 20px;
      transition: right 0.4s ease;
      z-index: 1050;
      overflow-y: auto;
    }
    .cart-panel.show {
      right: 0;
    }
    .cart-item {
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }
    .card-img-top {
      object-fit: cover;
      height: 200px;
    }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Products</h2>
    <button id="cart-toggle" class="btn btn-primary">🛒 Cart (<span id="cart-count">0</span>)</button>
  </div>

  <div class="row" id="product-container">
    <!-- Products rendered here -->
  </div>

  <div class="text-center mt-3">
    <button id="show-more" class="btn btn-secondary">Show More</button>
  </div>
</div>

<!-- Cart Panel -->
<div class="cart-panel" id="cart-panel">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Shopping Cart</h4>
    <button id="close-cart" class="btn-close"></button>
  </div>
  <div id="cart-items"></div>
</div>
<!-- jQuery & Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const products = Array.from({ length: 14 }, (_, i) => ({
    id: i + 1,
    name: `Product ${i + 1}`,
    price: (Math.random() * 100 + 10).toFixed(2),
    image: `https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcQxQ8-aIPrYgLH-S2EBo90xES5QSGUPxTqjpGUKWSpgNtFx4hCl9R_9OOL-_x9zyU46l3NU4n5qqEmO23nljQnLyaekQzENK6NXpnVQYKI7k8tkA3YOCOgf`
  }));

  let cart = [];

  function isInCart(id) {
    return cart.some(item => item.id === id);
  }

  function renderProducts(start = 0, count = 6) {
    const items = products.slice(start, start + count);
    items.forEach(product => {
      $('#product-container').append(`
        <div class="col-6 col-md-4 mb-4 product-item">
          <div class="card h-100">
            <img src="${product.image}" 
                 class="card-img-top" 
                 alt="${product.name}" 
                 onerror="this.onerror=null;this.src='https://via.placeholder.com/150?text=No+Image';">
            <div class="card-body text-center">
              <h5 class="card-title">${product.name}</h5>
              <p class="card-text">$${product.price}</p>
              <button class="btn btn-${isInCart(product.id) ? 'danger' : 'success'} toggle-cart" data-id="${product.id}">
                ${isInCart(product.id) ? 'Remove from Cart' : 'Add to Cart'}
              </button>
            </div>
          </div>
        </div>
      `);
    });
  } 

  function updateCart() {
  $('#cart-items').empty();
  cart.forEach(item => {
    $('#cart-items').append(`
      <div class="cart-item d-flex justify-content-between align-items-center">
        <div>
          <strong>${item.name}</strong><br>
          $${item.price}
        </div>
        <button class="btn btn-sm btn-danger remove-from-cart" data-id="${item.id}">Remove</button>
      </div>
    `);
  });
  $('#cart-count').text(cart.length);
}

// Close cart panel
$('#close-cart').on('click', function () {
  $('#cart-panel').removeClass('show');
});

// Remove from cart from inside the cart
$(document).on('click', '.remove-from-cart', function () {
  const id = $(this).data('id');
  const index = cart.findIndex(item => item.id === id);
  if (index >= 0) {
    cart.splice(index, 1);
    updateCart();
    reRenderButtons(); // update main grid buttons
  }
});

  function reRenderButtons() {
    $('.toggle-cart').each(function () {
      const id = $(this).data('id');
      const inCart = isInCart(id);
      $(this)
        .toggleClass('btn-success', !inCart)
        .toggleClass('btn-danger', inCart)
        .text(inCart ? 'Remove from Cart' : 'Add to Cart');
    });
  }

  $(document).ready(function () {
    let shown = 0;
    const showStep = 6;

    renderProducts(shown, showStep);
    shown += showStep;

    $('#show-more').on('click', function () {
      renderProducts(shown, showStep);
      shown += showStep;
      if (shown >= products.length) {
        $(this).hide();
      }
    });

    $('#cart-toggle').on('click', function () {
      $('#cart-panel').toggleClass('show');
    });

    $(document).on('click', '.toggle-cart', function () {
      const id = $(this).data('id');
      const product = products.find(p => p.id === id);
      const index = cart.findIndex(item => item.id === id);
      if (index >= 0) {
        cart.splice(index, 1);
      } else {
        cart.push(product);
      }
      updateCart();
      reRenderButtons();
    });
  });
</script>

</body>
</html>
