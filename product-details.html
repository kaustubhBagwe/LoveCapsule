    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:1050;"></div>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
     <a href="https://kaustubhbagwe.github.io/myaffliateprogram/">Home</a>
      
    </div>

  <!-- ✅ Product Detail Section -->
  <div class="container my-5" id="product-detail-container">
    <!-- Product data loads here -->
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function isInWishlist(id) {
      return wishlist.includes(id);
    }

    function isInCart(id) {
      return cart.includes(id);
    }

    function toggleWishlist(id, btn) {
      if (isInWishlist(id)) {
        wishlist = wishlist.filter(pid => pid !== id);
        $(btn).removeClass('btn-secondary').addClass('btn-warning');
        $(btn).find('i').removeClass('bi-heart-fill text-danger').addClass('bi-heart');
      } else {
        wishlist.push(id);
        $(btn).removeClass('btn-warning').addClass('btn-secondary');
        $(btn).find('i').removeClass('bi-heart').addClass('bi-heart-fill text-danger');
      }
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
      updateCounters();
    }

    function toggleCart(id, btn) {
      if (isInCart(id)) {
        cart = cart.filter(pid => pid !== id);
        $(btn).removeClass('btn-danger').addClass('btn-success').text('Add to Cart');
      } else {
        cart.push(id);
        $(btn).removeClass('btn-success').addClass('btn-danger').text('Remove');
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCounters();
    }

    function updateCounters() {
      $('#cart-icon').attr('data-count', cart.length);
      $('#wishlist-icon').attr('data-count', wishlist.length);
    }

    function populateCategories(products) {
      const categories = [...new Set(products.map(p => p.category))];
      const menu = $('#category-menu');
      menu.empty();
      categories.forEach(cat => {
        menu.append(`<li><a class="dropdown-item" href="#">${cat}</a></li>`);
      });
    }

    $(document).ready(function () {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = Number(urlParams.get('id'));

      if (!productId) {
        $('#product-detail-container').html('<div class="alert alert-danger">Invalid product ID.</div>');
        return;
      }

      $.getJSON('https://raw.githubusercontent.com/kaustubhBagwe/myaffliateprogram/Production/products.json', function (products) {
        const product = products.find(p => p.id === productId);
        if (!product) {
          $('#product-detail-container').html('<div class="alert alert-danger">Product not found.</div>');
          return;
        }

        populateCategories(products);
        updateCounters();

        $('#product-detail-container').html(`
          <div class="row gy-4 align-items-start">
            <div class="col-md-6">
              <img src="${product.image}" alt="${product.name}" class="product-image"
                   onerror="this.onerror=null;this.src='https://via.placeholder.com/350x350?text=No+Image';">
            </div>
            <div class="col-md-6">
              <h2>${product.name}</h2>
              <p class="text-muted">Category: ${product.category}</p>
              <div class="price mb-3">$${product.price}</div>
              <p>${product.description || 'No description available.'}</p>
              <div class="d-flex flex-wrap gap-2 mt-3">
                <button class="btn btn-${isInCart(product.id) ? 'danger' : 'success'} toggle-cart-btn">
                  ${isInCart(product.id) ? 'Remove' : 'Add to Cart'}
                </button>
                <button class="btn btn-${isInWishlist(product.id) ? 'secondary' : 'warning'} btn-icon wishlist-btn">
                  <i class="bi ${isInWishlist(product.id) ? 'bi-heart-fill text-danger' : 'bi-heart'}"></i>
                </button>
              </div>
            </div>
          </div>
        `);

        $('.wishlist-btn').on('click', function () {
          toggleWishlist(product.id, this);
        });

        $('.toggle-cart-btn').on('click', function () {
          toggleCart(product.id, this);
        });
      });

      // Optional: Search handler (redirect or filter logic can go here)
      $('#search-box').on('keypress', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          alert('Search for: ' + $(this).val());
        }
      });
    });
  </script>
</body>
</html>
